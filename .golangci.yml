version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocyclo
    - misspell
    - revive

  settings:
    errcheck:
      # Writing a report to an io.Writer is the tool's normal output path, and
      # a failed write there is not actionable: the destination is stdout or a
      # buffer the caller owns, and there is nowhere useful to report the
      # failure to. Requiring `_, _ =` on every print would add several hundred
      # assignments across the report renderers for no behavioural gain.
      #
      # Errors that represent a real decision — Close, Remove, Rename — are NOT
      # excluded and are written as an explicit `_ =` at the call site, so
      # ignoring them stays visible in review.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush

    gocyclo:
      # The old spine's orchestrators (union, merger, the scenes/orphans
      # scans) are gone and took the worst outliers with them; 57 dropped to
      # 40. What is left above the standard 30 is the sequential pipeline the
      # design calls for — fetch, validate, mutate, report at each step — and
      # internal/reclaim's end-to-end integration test, which walks an apply
      # and a prune step by step against a live Stash (39). No headroom to
      # spare, so a new outlier has to be argued for rather than absorbed.
      min-complexity: 40

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
          # A stuttering rename in a package other modules import is a breaking
          # change, so the check stays off rather than inviting one.
          arguments:
            - disableStutteringCheck
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

  exclusions:
    rules:
      # Custodian is an application, not a library: it has no exported package
      # API for other modules to consume. internal/ is unimportable by
      # definition, so godoc coverage on exported identifiers there is pure
      # churn rather than signal (see FSS's .golangci.yml for the same call on
      # a larger codebase).
      - path: internal/
        linters:
          - revive
        text: '^(exported|package-comments):'

      # Doc comments on test helpers add nothing to the public API surface.
      - path: _test\.go$
        linters:
          - revive
        text: '^(exported|package-comments|unused-parameter):'

formatters:
  enable:
    - gofmt
    - goimports
