name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Codecov uploads authenticate with an OIDC token. A reusable workflow
      # cannot grant itself more than the caller holds, so it has to be here.
      id-token: write
    secrets: inherit
    with:
      binary-name: custodian
      main-package: ./cmd/custodian
      # Path building in internal/organize/template.go and the config dirs in
      # internal/config/paths.go branch on runtime.GOOS/filepath.Separator.
      platform-tests: true
      # The library-mutation logic (merge/dedup/scan) is unit-tested against
      # fixtures and a fake VFS, not a live Stash, so it should never need a
      # network reach.
      offline-isolation: true
      check-aur-srcinfo: true

  # Custodian *mutates* a library — merge, dedup, scan — and until this job
  # nothing in CI had ever pointed it at a running Stash. The sibling repos
  # cover that kind of risk with a manual approval gate before a release;
  # Custodian deliberately has none (CONTRIBUTING.md), because this harness
  # boots a throwaway Stash, seeds it and runs the suite against it on every
  # single push — a check that runs continuously and can actually fail, rather
  # than an attestation at release time that nothing verifies.
  stash-integration:
    name: Stash integration
    uses: Anastylosis/.github/.github/workflows/stash-integration.yml@v1
    # `contents: read` is the whole requirement: the harness needs no OIDC
    # token and no secrets.
    permissions:
      contents: read
    with:
      url-env-var: SFX_INT_STASH_URL
      # The switch that lets this job fail. Without it every assertion in
      # the integration tests is free to skip on an empty library and still
      # report green.
      seeded-env-var: SFX_INT_STASH_SEEDED
      # internal/reclaim/integration_test.go moves and deletes files in the
      # fixture library — Apply's moveFiles into /library/_quarantine and
      # Prune's sceneMerge + deleteFiles. The library is mounted read-only by
      # default (see the reusable workflow's own doc comment), so both of the
      # following are required together:
      #   * library-writable: true, mounting the fixture library `:rw`. This
      #     input only exists in Anastylosis/.github as of 66fb8c2; the `v1`
      #     tag this job is pinned to still points one commit before that, so
      #     `v1` has to move past 66fb8c2 (or this job re-pinned to a later
      #     tag/sha) before this setting takes effect.
      #   * SFX_INT_STASH_WRITABLE=1, the test's own belt-and-suspenders gate
      #     so a bare SFX_INT_STASH_URL against someone's read-only or
      #     production Stash can never trigger it by accident.
      # There is no generic "set this env var" input on the reusable
      # workflow (only url-env-var/api-key-env-var/seeded-env-var, each
      # exported under a caller-chosen *name*), so SFX_INT_STASH_WRITABLE and
      # SFX_INT_STASH_LIBRARY_DIR (the host path the test stats to confirm a
      # quarantined file is physically gone, not just gone from Stash's own
      # bookkeeping) are set directly on test-command instead.
      library-writable: true
      # No build tag on these tests, so the harness default
      # (`-tags=integration ./...`) would run nothing. All four packages carry
      # the same env-gated pattern, so they widen one command rather than
      # taking a job each.
      test-command: >-
        SFX_INT_STASH_WRITABLE=1 SFX_INT_STASH_LIBRARY_DIR="$RUNNER_TEMP/stash-library"
        go test -count=1 ./internal/mirror/... ./internal/evidence/... ./internal/reclaim/... ./internal/subs/...

# What Custodian gains by adopting: gotestsum + JUnit + Codecov upload, the
# coverage step summary, and a cross-build matrix — none of which its hand-
# written ci.yml had. It keeps the exact action pinning it already insisted
# on, which is now the shared policy.
#
# Custodian has no Dockerfile, so check-dockerfile-go-version stays off and
# there is no docker workflow to adopt.
#
# Its internal/{mirror,evidence,reclaim,subs}/integration_test.go files
# carry no build tag: each is gated on SFX_INT_STASH_URL at runtime instead,
# so `go test ./...` in the `ci` job skips every one of those tests and
# stays hermetic. The stash-integration job is what supplies that variable —
# along with SFX_INT_STASH_SEEDED, which turns the skips into assertions,
# and SFX_INT_STASH_WRITABLE, which reclaim's alone additionally requires
# because it is the only one of the four that moves and deletes files.
# vet-integration-tag stays off; there is no tag for it to check.
