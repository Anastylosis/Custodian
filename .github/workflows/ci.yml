name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: Anastylosis/.github/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
      checks: write
      # Codecov uploads authenticate with an OIDC token. A reusable workflow
      # cannot grant itself more than the caller holds, so it has to be here.
      id-token: write
    secrets: inherit
    with:
      binary-name: custodian
      main-package: ./cmd/custodian

# What Custodian gains by adopting: gotestsum + JUnit + Codecov upload, the
# coverage step summary, and a cross-build matrix — none of which its hand-
# written ci.yml had. It keeps the exact action pinning it already insisted
# on, which is now the shared policy.
#
# Custodian has no Dockerfile, so check-dockerfile-go-version stays off and
# there is no docker workflow to adopt.
#
# Its internal/stash/integration_test.go carries no build tag, so it runs in
# the normal suite. If that ever starts hitting a live Stash, gate it behind
# //go:build integration and flip vet-integration-tag on.
