name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # No nfpm, aur or docker: Custodian ships binaries only — it has no
  # Dockerfile and no packaging/ directory.
  release:
    uses: Anastylosis/.github/.github/workflows/go-release.yml@v1
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      binary-name: custodian
      main-package: ./cmd/custodian
      install-instructions: |
        Download the binary for your platform, extract, and run:

        ```sh
        # Linux (amd64)
        tar xzf custodian-${{ github.ref_name }}-linux-amd64.tar.gz
        chmod +x custodian
        ./custodian config init

        # macOS (Apple Silicon)
        tar xzf custodian-${{ github.ref_name }}-darwin-arm64.tar.gz
        chmod +x custodian
        ./custodian config init
        ```

        Or build from source:
        ```sh
        go install github.com/Anastylosis/Custodian/cmd/custodian@${{ github.ref_name }}
        ```
