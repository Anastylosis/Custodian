name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}"
          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            binary="stash-janitor"
            archive="stash-janitor-${VERSION}-${GOOS}-${GOARCH}"

            if [ "$GOOS" = "windows" ]; then
              binary="stash-janitor.exe"
            fi

            echo "Building ${GOOS}/${GOARCH}..."
            GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/${binary}" ./cmd/stash-janitor

            # Package as tar.gz (or zip for Windows)
            cd dist
            if [ "$GOOS" = "windows" ]; then
              zip "${archive}.zip" "${binary}"
            else
              tar czf "${archive}.tar.gz" "${binary}"
            fi
            rm "${binary}"
            cd ..
          done

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # Capture the checksums BEFORE creating the file: the shell opens a
          # redirect target before expanding the glob, so `* > SHA256SUMS`
          # would hash an empty SHA256SUMS into its own listing. Sorted so the
          # file is stable and diffable between releases.
          sums=$(sha256sum -- *)
          echo "$sums" | LC_ALL=C sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # Every line must verify before it is published.
          sha256sum --check --strict SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline --no-merges)
          else
            CHANGELOG=$(git log --oneline --no-merges "${PREV_TAG}..HEAD")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Download the binary for your platform, extract, and run:

            ```sh
            # Linux (amd64)
            tar xzf stash-janitor-${{ github.ref_name }}-linux-amd64.tar.gz
            chmod +x stash-janitor
            ./stash-janitor config init

            # macOS (Apple Silicon)
            tar xzf stash-janitor-${{ github.ref_name }}-darwin-arm64.tar.gz
            chmod +x stash-janitor
            ./stash-janitor config init
            ```

            Or build from source:
            ```sh
            go install github.com/Wasylq/StashJanitor/cmd/stash-janitor@${{ github.ref_name }}
            ```
